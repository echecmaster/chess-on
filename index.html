<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Échecs Multijoueur - Cloud</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
          --gold: #c9a84c;
          --gold-light: #e8c96b;
          --gold-dark: #8a6f2e;
          --cream: #f5ead8;
          --dark: #1a120b;
          --dark2: #241910;
          --dark3: #2e2015;
          --brown: #4a2e1a;
          --brown2: #6b3f22;
          --red: #c0392b;
          --green: #27ae60;
          --white-sq: #f0d9b5;
          --black-sq: #b58863;
          --shadow: 0 8px 32px rgba(0,0,0,0.6);
          --glow: 0 0 20px rgba(201,168,76,0.3);
        }

        * { 
          box-sizing: border-box; 
          margin: 0; 
          padding: 0; 
          -webkit-tap-highlight-color: transparent;
        }

        body {
          font-family: 'Crimson Text', serif;
          background: var(--dark);
          color: var(--cream);
          min-height: 100vh;
          overflow-x: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 30px 15px;
          touch-action: manipulation;
        }

        body::before {
          content: '';
          position: fixed;
          inset: 0;
          background: 
            radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.05) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 80%, rgba(74,46,26,0.3) 0%, transparent 50%);
          pointer-events: none;
          z-index: 0;
        }

        h1 {
          font-family: 'Cinzel', serif;
          font-size: 2.2rem;
          font-weight: 900;
          color: var(--gold);
          letter-spacing: 0.1em;
          text-shadow: 0 0 40px rgba(201,168,76,0.4);
          margin-bottom: 5px;
          position: relative;
          z-index: 1;
          text-align: center;
        }

        .user-stats {
          font-size: 1.1rem;
          color: #a89070;
          font-style: italic;
          margin-bottom: 20px;
          position: relative;
          z-index: 1;
          text-align: center;
        }

        .user-stats b {
            color: var(--gold);
            font-family: 'Cinzel', serif;
        }

        .container {
          background: var(--dark2);
          border: 1px solid var(--gold-dark);
          border-radius: 16px;
          padding: 2rem;
          width: 100%;
          max-width: 600px;
          box-shadow: var(--shadow), var(--glow);
          text-align: center;
          position: relative;
          z-index: 1;
        }

        input {
          width: 100%;
          background: var(--dark3);
          border: 1px solid var(--brown2);
          border-radius: 8px;
          padding: 0.75rem 1rem;
          color: var(--cream);
          font-family: 'Crimson Text', serif;
          font-size: 1.1rem;
          outline: none;
          transition: border-color 0.2s, box-shadow 0.2s;
          margin-bottom: 15px;
        }

        input:focus {
          border-color: var(--gold);
          box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
        }

        button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.6rem;
          padding: 0.9rem 1.6rem;
          border: none;
          border-radius: 8px;
          font-family: 'Cinzel', serif;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
          letter-spacing: 0.05em;
          margin: 8px 5px;
          background: linear-gradient(135deg, var(--gold-dark), var(--gold)) !important;
          color: var(--dark) !important;
          box-shadow: 0 4px 16px rgba(201,168,76,0.3);
        }

        button:hover, button:active {
          background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
          transform: translateY(-1px);
          box-shadow: 0 6px 24px rgba(201,168,76,0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #922b21, var(--red)) !important;
            color: var(--cream) !important;
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.3);
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, var(--red), #e74c3c) !important;
            box-shadow: 0 6px 24px rgba(192, 57, 43, 0.5);
        }

        .btn-huge {
            font-size: 1.3rem;
            padding: 1.2rem 2.5rem;
            width: 100%;
            margin-top: 20px;
        }

        .hidden { display: none !important; }

        #auth-section, #lobby-section, #game-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        }

        .matchmaking-status {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--gold-light);
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #board {
          width: 440px;
          max-width: 100%;
          margin: 10px auto;
          border: 4px solid var(--gold-dark);
          box-shadow: var(--shadow), var(--glow);
          border-radius: 6px;
        }

        .player-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--dark3);
            padding: 8px 12px;
            border: 1px solid var(--brown);
            border-radius: 6px;
            margin: 5px 0;
            font-family: 'Cinzel', serif;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-name { font-weight: 600; color: var(--cream); font-size: 1.1rem; }
        .player-elo { color: var(--gold); font-size: 0.9rem; }

        .timer {
            font-size: 1.3rem;
            font-weight: 900;
            background: var(--dark);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--cream);
            border: 1px solid var(--brown2);
            min-width: 80px;
            text-align: center;
        }

        .timer.active {
            background: var(--gold-dark);
            color: var(--dark);
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(201,168,76,0.4);
        }

        .timer.danger {
            background: var(--red);
            color: white;
            animation: pulse 1s infinite;
        }

        /* Cases de déplacements */
        .square-highlight { position: relative; }
        .square-highlight::after {
          content: ''; position: absolute; width: 26%; height: 26%;
          background: rgba(201, 168, 76, 0.7); border-radius: 50%;
          top: 50%; left: 50%; transform: translate(-50%, -50%);
          z-index: 10; pointer-events: none; box-shadow: 0 0 6px rgba(201, 168, 76, 0.5);
        }

        .square-capture { position: relative; }
        .square-capture::after {
          content: ''; position: absolute; width: 86%; height: 86%;
          border: 4px solid rgba(201, 168, 76, 0.7); border-radius: 50%;
          top: 50%; left: 50%; transform: translate(-50%, -50%);
          z-index: 10; pointer-events: none; box-sizing: border-box;
        }

        /* MODAL DE FIN DE PARTIE */
        #endgame-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(26, 18, 11, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #endgame-modal.visible { opacity: 1; pointer-events: all; }

        .modal-content {
            background: var(--dark2);
            border: 2px solid var(--gold);
            padding: 3rem 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 50px rgba(201, 168, 76, 0.3);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #endgame-modal.visible .modal-content { transform: scale(1); }

        .modal-title {
            font-family: 'Cinzel', serif; font-size: 3rem; font-weight: 900;
            margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .modal-title.win { color: var(--gold-light); }
        .modal-title.loss { color: var(--red); }
        .modal-title.draw { color: #bdc3c7; }

        .modal-reason { font-size: 1.2rem; color: #a89070; margin-bottom: 20px; font-style: italic; }
        
        .modal-elo {
            font-family: 'Cinzel', serif; font-size: 2rem; font-weight: bold;
            margin-bottom: 30px;
        }
        .modal-elo.positive { color: var(--green); }
        .modal-elo.negative { color: var(--red); }
        .modal-elo.neutral { color: #bdc3c7; }

        @media (max-width: 768px) {
          .container { padding: 1.25rem; }
          #board { width: 92vw; max-width: 100%; }
          .player-bar { width: 92vw; }
          button { width: 100%; padding: 1rem; }
          .modal-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <h1>Échecs Cloud ♟️</h1>
    <p id="user-display" class="user-stats">Non connecté</p>

    <div class="container">

        <div id="auth-section">
            <h2 style="margin-bottom: 5px;">Connexion / Inscription</h2>
            <p style="font-size: 0.95em; color: #a89070; font-style: italic; margin-bottom: 20px;">
                Entrez un pseudo unique et un mot de passe
            </p>
            <input type="text" id="pseudo" placeholder="Votre pseudo" autocomplete="off">
            <input type="password" id="password" placeholder="Mot de passe">
            <div style="width: 100%; display: flex; gap: 10px;">
                <button type="button" onclick="signUp()" style="flex: 1;">S'inscrire</button>
                <button type="button" onclick="signIn()" style="flex: 1;">Se connecter</button>
            </div>
            <p id="auth-error" style="color:#f87171; font-family:'Cinzel', serif; font-weight:bold; margin-top: 10px;"></p>
        </div>

        <div id="lobby-section" class="hidden">
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">Prêt à combattre ?</h2>
            <p style="color: #a89070; margin-bottom: 20px;">Affrontez des joueurs du monde entier. Temps : 10 minutes.</p>
            
            <button class="btn-huge" id="btn-play" onclick="startMatchmaking()">
                ⚔️ JOUER MAINTENANT
            </button>
            <p id="matchmaking-status" class="matchmaking-status hidden">Recherche d'un adversaire en cours...</p>
        </div>

        <div id="game-section" class="hidden">
            
            <div class="player-bar" id="opponent-bar">
                <div class="player-info">
                    <span class="player-name" id="opponent-name">Adversaire</span>
                    <span class="player-elo" id="opponent-elo">(?)</span>
                </div>
                <div class="timer" id="opponent-timer">10:00</div>
            </div>

            <div id="board"></div>

            <div class="player-bar" id="my-bar">
                <div class="player-info">
                    <span class="player-name" id="my-name">Moi</span>
                    <span class="player-elo" id="my-elo">(?)</span>
                </div>
                <div class="timer" id="my-timer">10:00</div>
            </div>

            <div style="width: 100%; display: flex; justify-content: center; margin-top: 15px;">
                <button onclick="resignGame()" class="btn-danger" style="width: auto;">🏳️ Abandonner</button>
            </div>
        </div>

    </div>

    <div id="endgame-modal">
        <div class="modal-content">
            <div class="modal-title" id="end-title">Victoire !</div>
            <div class="modal-reason" id="end-reason">par Échec et mat</div>
            <div class="modal-elo" id="end-elo">+15 ELO</div>
            <button class="btn-huge" onclick="closeEndGameAndReturn()">TERMINÉ</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://ohrpvrmghqwkpzuyuxdr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocnB2cm1naHF3a3B6dXl1eGRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTIzNjAsImV4cCI6MjA5NTAyODM2MH0.upKnSORw3p0ao4iX5qa4chZYDgeyZXxWiwbSKlX42PI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserPseudo = null;
        let currentUserElo = 200;
        let opponentPseudo = null;
        let opponentElo = 200;

        let currentGameId = null;
        let playerColor = null;
        let board = null;
        let game = new Chess();
        let realtimeSubscription = null;
        let selectedSquare = null;

        // Timers Variables
        let timerInterval = null;
        let timeWhite = 600; 
        let timeBlack = 600;
        let gameStatus = 'waiting';

        // Constantes Elo
        const ELO_K = 32;

        /* ================= AUTHENTIFICATION ================= */

        async function signUp() {
            const pseudo = document.getElementById('pseudo').value.trim();
            const password = document.getElementById('password').value;
            if (!pseudo || !password) return showError('Remplissez tous les champs.');

            try {
                const { data: existingUser } = await supabaseClient.from('profiles').select('pseudo').eq('pseudo', pseudo).maybeSingle();
                if (existingUser) return showError('Ce pseudo est déjà pris !');

                // Création avec 200 elo par défaut
                const { error } = await supabaseClient.from('profiles').insert([{ pseudo, password, elo: 200 }]);
                if (error) throw error;

                currentUserPseudo = pseudo;
                currentUserElo = 200;
                showLobby();
            } catch (err) { showError(err.message); }
        }

        async function signIn() {
            const pseudo = document.getElementById('pseudo').value.trim();
            const password = document.getElementById('password').value;
            if (!pseudo || !password) return showError('Remplissez tous les champs.');

            try {
                const { data: user, error } = await supabaseClient.from('profiles').select('*').eq('pseudo', pseudo).eq('password', password).maybeSingle();
                if (error) throw error;
                if (!user) return showError('Identifiants incorrects.');

                currentUserPseudo = user.pseudo;
                currentUserElo = user.elo !== undefined ? user.elo : 200;
                showLobby();
            } catch (err) { showError(err.message); }
        }

        function showError(msg) { document.getElementById('auth-error').innerText = msg; }

        /* ================= NAVIGATION ================= */

        function showLobby() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('lobby-section').classList.remove('hidden');
            
            document.getElementById('user-display').innerHTML = `${currentUserPseudo} | <b>${currentUserElo} ELO</b>`;
            
            document.getElementById('btn-play').classList.remove('hidden');
            document.getElementById('matchmaking-status').classList.add('hidden');
            
            currentGameId = null;
            clearInterval(timerInterval);
        }

        /* ================= MATCHMAKING ================= */

        async function startMatchmaking() {
            document.getElementById('btn-play').classList.add('hidden');
            document.getElementById('matchmaking-status').classList.remove('hidden');

            try {
                // Cherche une partie en attente qui n'est pas la sienne
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'waiting')
                    .neq('player_white', currentUserPseudo)
                    .limit(1);

                if (error) throw error;

                if (games && games.length > 0) {
                    // Rejoindre partie existante en tant que Noir
                    currentGameId = games[0].id;
                    playerColor = 'b';
                    opponentPseudo = games[0].player_white;

                    await supabaseClient.from('games').update({ 
                        player_black: currentUserPseudo, 
                        status: 'playing',
                        white_time: 600,
                        black_time: 600
                    }).eq('id', currentGameId);

                    await fetchOpponentElo(opponentPseudo);
                    initGameUI();
                    subscribeToGame();
                } else {
                    // Créer une nouvelle partie et attendre (Blanc)
                    playerColor = 'w';
                    const { data, error: insertErr } = await supabaseClient.from('games').insert([{ 
                        player_white: currentUserPseudo, 
                        status: 'waiting', 
                        fen: 'start',
                        white_time: 600,
                        black_time: 600
                    }]).select();

                    if (insertErr) throw insertErr;
                    
                    currentGameId = data[0].id;
                    initGameUI();
                    subscribeToGame();
                }
            } catch (err) {
                alert("Erreur Matchmaking: " + err.message);
                showLobby();
            }
        }

        async function fetchOpponentElo(pseudo) {
            try {
                const { data } = await supabaseClient.from('profiles').select('elo').eq('pseudo', pseudo).maybeSingle();
                opponentElo = (data && data.elo !== undefined) ? data.elo : 200;
            } catch (e) { opponentElo = 200; }
        }

        /* ================= JEU ================= */

        function initGameUI() {
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');

            game = new Chess();
            timeWhite = 600;
            timeBlack = 600;
            gameStatus = 'waiting';

            document.getElementById('my-name').innerText = currentUserPseudo;
            document.getElementById('my-elo').innerText = `(${currentUserElo})`;
            
            if (playerColor === 'b') {
                document.getElementById('opponent-name').innerText = opponentPseudo;
                document.getElementById('opponent-elo').innerText = `(${opponentElo})`;
                gameStatus = 'playing';
            } else {
                document.getElementById('opponent-name').innerText = "Recherche...";
                document.getElementById('opponent-elo').innerText = "";
            }

            updateTimersUI();

            const config = {
                draggable: true,
                position: 'start',
                orientation: playerColor === 'w' ? 'white' : 'black',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            board = Chessboard('board', config);
            
            $('#board').off('click', '.square-55d63').on('click', '.square-55d63', function() {
                handleSquareClick($(this).attr('data-square'));
            });
            
            $(window).off('resize', board.resize).on('resize', board.resize);
            setTimeout(board.resize, 150);
        }

        /* ================= LOGIQUE ECHIQUIER ================= */

        function removeHighlights() {
            document.querySelectorAll('#board .square-55d63').forEach(sq => {
                sq.classList.remove('square-highlight', 'square-capture');
            });
        }

        function showPossibleMoves(square) {
            removeHighlights();
            const piece = game.get(square);
            if (!piece || gameStatus !== 'playing') return;
            if ((playerColor === 'w' && piece.color !== 'w') || (playerColor === 'b' && piece.color !== 'b')) return;

            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                const sqEl = document.querySelector(`#board .square-${move.to}`);
                if (sqEl) {
                    if (game.get(move.to)) sqEl.classList.add('square-capture');
                    else sqEl.classList.add('square-highlight');
                }
            });
        }

        function handleSquareClick(square) {
            if (gameStatus !== 'playing' || game.game_over() || game.turn() !== playerColor) return;

            const piece = game.get(square);

            if (selectedSquare) {
                const moves = game.moves({ square: selectedSquare, verbose: true });
                if (moves.some(m => m.to === square)) {
                    const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                    if (move) {
                        board.position(game.fen());
                        updateGameInDB(game.fen());
                    }
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }
            }

            if (piece && piece.color === playerColor) {
                if (selectedSquare === square) {
                    selectedSquare = null; removeHighlights();
                } else {
                    selectedSquare = square; showPossibleMoves(square);
                }
            } else {
                selectedSquare = null; removeHighlights();
            }
        }

        function onDragStart(source, piece) {
            if (gameStatus !== 'playing' || game.game_over()) return false;
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) || (playerColor === 'b' && piece.search(/^w/) !== -1)) return false;
            if (game.turn() !== playerColor) return false;
        }

        function onDrop(source, target) {
            removeHighlights(); selectedSquare = null;
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            updateGameInDB(game.fen());
        }

        function onSnapEnd() { board.position(game.fen()); }

        /* ================= GESTION DB & TEMPS ================= */

        async function updateGameInDB(newFen) {
            let status = 'playing';
            let winner = null;
            let reason = null;

            if (game.in_checkmate()) {
                status = 'finished'; winner = playerColor; reason = 'checkmate';
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                status = 'finished'; winner = 'draw'; reason = 'pat';
            }

            await supabaseClient.from('games').update({
                fen: newFen, status: status, 
                white_time: timeWhite, black_time: timeBlack,
                winner: winner, end_reason: reason
            }).eq('id', currentGameId);
        }

        async function resignGame() {
            if (gameStatus !== 'playing') return;
            const winner = playerColor === 'w' ? 'b' : 'w';
            await supabaseClient.from('games').update({
                status: 'finished', winner: winner, end_reason: 'resign'
            }).eq('id', currentGameId);
        }

        async function handleTimeout() {
            if (gameStatus !== 'playing') return;
            const winner = game.turn() === 'w' ? 'b' : 'w';
            await supabaseClient.from('games').update({
                status: 'finished', winner: winner, end_reason: 'timeout'
            }).eq('id', currentGameId);
        }

        /* ================= TIMERS ================= */

        function startTimers() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameStatus !== 'playing') return clearInterval(timerInterval);

                if (game.turn() === 'w') {
                    timeWhite--;
                    if (timeWhite <= 0 && playerColor === 'w') { timeWhite = 0; handleTimeout(); }
                } else {
                    timeBlack--;
                    if (timeBlack <= 0 && playerColor === 'b') { timeBlack = 0; handleTimeout(); }
                }
                updateTimersUI();
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(Math.max(0, seconds) / 60);
            const s = Math.max(0, seconds) % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimersUI() {
            const myTime = playerColor === 'w' ? timeWhite : timeBlack;
            const oppTime = playerColor === 'w' ? timeBlack : timeWhite;
            
            const myTimerEl = document.getElementById('my-timer');
            const oppTimerEl = document.getElementById('opponent-timer');

            myTimerEl.innerText = formatTime(myTime);
            oppTimerEl.innerText = formatTime(oppTime);

            myTimerEl.className = 'timer' + (gameStatus === 'playing' && game.turn() === playerColor ? ' active' : '') + (myTime < 30 ? ' danger' : '');
            oppTimerEl.className = 'timer' + (gameStatus === 'playing' && game.turn() !== playerColor ? ' active' : '') + (oppTime < 30 ? ' danger' : '');
        }

        /* ================= SUBSCRIPTION ================= */

        function subscribeToGame() {
            if (realtimeSubscription) supabaseClient.removeChannel(realtimeSubscription);

            realtimeSubscription = supabaseClient.channel('custom-game-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${currentGameId}` },
                async payload => {
                    const newData = payload.new;

                    // Adversaire a rejoint
                    if (gameStatus === 'waiting' && newData.status === 'playing' && playerColor === 'w') {
                        opponentPseudo = newData.player_black;
                        await fetchOpponentElo(opponentPseudo);
                        document.getElementById('opponent-name').innerText = opponentPseudo;
                        document.getElementById('opponent-elo').innerText = `(${opponentElo})`;
                        gameStatus = 'playing';
                        startTimers();
                    }

                    // Synchro Temps
                    timeWhite = newData.white_time;
                    timeBlack = newData.black_time;

                    // Mouvement
                    if (newData.fen !== game.fen() && newData.fen !== 'start') {
                        game.load(newData.fen);
                        board.position(newData.fen);
                    }

                    updateTimersUI();

                    // Fin de partie
                    if (newData.status === 'finished' && gameStatus !== 'finished') {
                        gameStatus = 'finished';
                        clearInterval(timerInterval);
                        triggerEndGame(newData.winner, newData.end_reason);
                    }
                }).subscribe();
        }

        /* ================= ELO & FIN DE PARTIE ================= */

        async function triggerEndGame(winnerColor, reason) {
            let title = ""; let titleClass = ""; let reasonTxt = "";
            let isWin = false; let isDraw = false;

            if (winnerColor === 'draw') {
                title = "Match Nul"; titleClass = "draw"; isDraw = true;
                reasonTxt = "par Pat / Répétition";
            } else if (winnerColor === playerColor) {
                title = "Victoire !"; titleClass = "win"; isWin = true;
            } else {
                title = "Défaite..."; titleClass = "loss";
            }

            if (!isDraw) {
                if (reason === 'checkmate') reasonTxt = "par Échec et mat";
                else if (reason === 'resign') reasonTxt = "par Abandon de l'adversaire";
                else if (reason === 'timeout') reasonTxt = "au Temps";
            }

            // Calcul ELO
            const expectedScore = 1 / (1 + Math.pow(10, (opponentElo - currentUserElo) / 400));
            const actualScore = isWin ? 1 : (isDraw ? 0.5 : 0);
            const eloChange = Math.round(ELO_K * (actualScore - expectedScore));
            
            currentUserElo = Math.max(0, currentUserElo + eloChange);
            
            // Mise à jour BDD Profil
            await supabaseClient.from('profiles').update({ elo: currentUserElo }).eq('pseudo', currentUserPseudo);

            // Affichage UI Modal
            document.getElementById('end-title').innerText = title;
            document.getElementById('end-title').className = "modal-title " + titleClass;
            document.getElementById('end-reason').innerText = reasonTxt;
            
            const eloEl = document.getElementById('end-elo');
            if (eloChange > 0) { eloEl.innerText = `+${eloChange} ELO`; eloEl.className = "modal-elo positive"; }
            else if (eloChange < 0) { eloEl.innerText = `${eloChange} ELO`; eloEl.className = "modal-elo negative"; }
            else { eloEl.innerText = `+0 ELO`; eloEl.className = "modal-elo neutral"; }

            setTimeout(() => {
                document.getElementById('endgame-modal').classList.add('visible');
            }, 500);
        }

        function closeEndGameAndReturn() {
            document.getElementById('endgame-modal').classList.remove('visible');
            showLobby();
        }

    </script>
</body>
