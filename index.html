<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Échecs Multijoueur - 100% Pseudos</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; }
        .container {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
        }
        input { width: calc(100% - 30px); margin-bottom: 15px; background: #fff; color: #333; }
        button {
            background-color: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #2ecc71; }
        .hidden { display: none !important; }
        
        /* Sections */
        #auth-section, #lobby-section, #game-section { display: flex; flex-direction: column; align-items: center; }
        
        .game-list {
            list-style: none;
            padding: 0;
            width: 100%;
        }
        .game-list li {
            background: #2c3e50;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #board { width: 360px; max-width: 100%; margin: 20px auto; }
        .status-box { margin-top: 15px; font-weight: bold; color: #f1c40f; font-size: 1.1em; }
    </style>
</head>
<body>

    <h1>Échecs Cloud ♟️</h1>
    <p id="user-display">Non connecté</p>

    <div class="container">
        
        <div id="auth-section">
            <h2>Connexion / Inscription</h2>
            <p style="font-size: 0.9em; color: #bdc3c7;">Entrez un pseudo unique et un mot de passe</p>
            <input type="text" id="pseudo" placeholder="Votre pseudo (ex: Joueur123)" autocomplete="off">
            <input type="password" id="password" placeholder="Mot de passe">
            <div>
                <button type="button" onclick="signUp()">S'inscrire</button>
                <button type="button" onclick="signIn()">Se connecter</button>
            </div>
            <p id="auth-error" style="color: #e74c3c; font-size: 1em; margin-top: 10px; font-weight: bold;"></p>
        </div>

        <div id="lobby-section" class="hidden">
            <h2>Lobby des parties</h2>
            <button onclick="createGame()" style="background-color: #2980b9;">Créer une nouvelle partie (Blancs)</button>
            <button onclick="fetchGames()" style="background-color: #8e44ad; margin-top: 10px;">Rafraîchir la liste</button>
            
            <ul class="game-list" id="games-ul">
                </ul>
        </div>

        <div id="game-section" class="hidden">
            <h2 id="game-title">Partie en cours</h2>
            <button onclick="leaveGame()" style="background-color: #c0392b; margin-bottom: 10px;">Quitter la partie</button>
            <div id="board"></div>
            <div class="status-box" id="game-status">Attente d'un adversaire...</div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- 1. CONFIGURATION SUPABASE ---
        const SUPABASE_URL = 'https://ohrpvrmghqwkpzuyuxdr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocnB2cm1naHF3a3B6dXl1eGRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTIzNjAsImV4cCI6MjA5NTAyODM2MH0.upKnSORw3p0ao4iX5qa4chZYDgeyZXxWiwbSKlX42PI';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- VARIABLES GLOBALES ---
        let currentUserPseudo = null;
        let currentGameId = null;
        let playerColor = null; 
        let board = null;
        let game = new Chess();
        let realtimeSubscription = null;

        // --- 2. NOUVELLE LOGIQUE D'AUTHENTIFICATION PAR TABLE DE DONNÉES ---
        async function signUp() {
            const pseudo = document.getElementById('pseudo').value.trim();
            const password = document.getElementById('password').value;
            
            if(!pseudo || !password) {
                showError("Veuillez remplir tous les champs.");
                return;
            }
            showError("Vérification du pseudo...");

            try {
                // Étape A : Vérifier si le pseudo existe déjà
                const { data: existingUser } = await supabaseClient
                    .from('profiles')
                    .select('pseudo')
                    .eq('pseudo', pseudo)
                    .maybeSingle();

                if (existingUser) {
                    showError("Ce pseudo est déjà pris ! Choisissez-en un autre.");
                    return;
                }

                // Étape B : Insérer le nouveau profil
                const { error } = await supabaseClient
                    .from('profiles')
                    .insert([{ pseudo: pseudo, password: password }]);

                if (error) throw error;

                currentUserPseudo = pseudo;
                alert("Compte créé avec succès ! Bienvenue " + pseudo);
                showLobby();

            } catch (err) {
                showError("Erreur d'inscription : " + err.message);
            }
        }

        async function signIn() {
            const pseudo = document.getElementById('pseudo').value.trim();
            const password = document.getElementById('password').value;
            
            if(!pseudo || !password) {
                showError("Veuillez remplir tous les champs.");
                return;
            }
            showError("Connexion...");

            try {
                // Chercher le profil correspondant au pseudo et mot de passe
                const { data: user, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('pseudo', pseudo)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (!user) {
                    showError("Pseudo ou mot de passe incorrect.");
                    alert("Pseudo ou mot de passe incorrect.");
                    return;
                }

                currentUserPseudo = user.pseudo;
                showLobby();

            } catch (err) {
                showError("Erreur de connexion : " + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('auth-error').innerText = msg;
        }

        // --- 3. GESTION DU LOBBY ---
        function showLobby() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('lobby-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = "Joueur connecté : " + currentUserPseudo;
            fetchGames();
        }

        async function fetchGames() {
            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'waiting')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const ul = document.getElementById('games-ul');
                ul.innerHTML = '';
                
                if(games.length === 0) {
                    ul.innerHTML = '<li style="justify-content: center;">Aucune partie en attente. Créez-en une !</li>';
                }

                games.forEach(g => {
                    if (g.player_white !== currentUserPseudo) {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>Partie de <b>${g.player_white}</b></span>
                            <button onclick="joinGame('${g.id}')" style="background-color: #e67e22;">Rejoindre (Noirs)</button>
                        `;
                        ul.appendChild(li);
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function createGame() {
            try {
                const { data, error } = await supabaseClient
                    .from('games')
                    .insert([{ player_white: currentUserPseudo, status: 'waiting', fen: 'start' }])
                    .select();

                if (error) throw error;
                
                currentGameId = data[0].id;
                playerColor = 'w';
                initGameUI();
                subscribeToGame();
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        }

        async function joinGame(gameId) {
            try {
                const { error } = await supabaseClient
                    .from('games')
                    .update({ player_black: currentUserPseudo, status: 'playing' })
                    .eq('id', gameId);

                if (error) throw error;

                currentGameId = gameId;
                playerColor = 'b';
                initGameUI();
                subscribeToGame();
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        }

        function leaveGame() {
            if(realtimeSubscription) supabaseClient.removeChannel(realtimeSubscription);
            currentGameId = null;
            playerColor = null;
            showLobby();
        }

        // --- 4. ENGINE ET LOGIQUE DU JEU D'ÉCHECS ---
        function initGameUI() {
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            
            game = new Chess();
            
            const config = {
                draggable: true,
                position: 'start',
                orientation: playerColor === 'w' ? 'white' : 'black',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
            };
            
            board = Chessboard('board', config);
            updateStatusLabel("Attente qu'un adversaire rejoigne...");
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
            
            if ((game.turn() === 'w' && playerColor !== 'w') ||
                (game.turn() === 'b' && playerColor !== 'b')) {
                return false;
            }
        }

        function onDrop (source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';
            updateGameInDB(game.fen());
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        async function updateGameInDB(newFen) {
            let newStatus = 'playing';
            if(game.game_over()) newStatus = 'finished';

            await supabaseClient
                .from('games')
                .update({ fen: newFen, status: newStatus })
                .eq('id', currentGameId);
        }

        function updateStatusLabel(text) {
            document.getElementById('game-status').innerText = text;
        }

        // --- 5. REALTIME (SYNCHRONISATION DES COUPS) ---
        function subscribeToGame() {
            if(realtimeSubscription) supabaseClient.removeChannel(realtimeSubscription);

            realtimeSubscription = supabaseClient.channel('custom-game-channel')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'games', 
                    filter: `id=eq.${currentGameId}` 
                }, payload => {
                    const newData = payload.new;
                    
                    if(newData.fen !== game.fen()) {
                        game.load(newData.fen);
                        board.position(newData.fen);
                    }

                    let turnText = game.turn() === 'w' ? 'Blancs' : 'Noirs';
                    let statusTxt = "Au tour des " + turnText;
                    
                    if (game.turn() === playerColor) {
                        statusTxt += " (À vous !)";
                    } else {
                        statusTxt += " (L'adversaire réfléchit...)";
                    }
                    
                    if(newData.status === 'finished') {
                        if (game.in_checkmate()) statusTxt = "Échec et mat ! Fin de la partie.";
                        else if (game.in_draw()) statusTxt = "Match nul !";
                        else statusTxt = "Partie terminée.";
                    } else if (!newData.player_black) {
                        statusTxt = "En attente qu'un adversaire rejoigne la partie...";
                    }

                    updateStatusLabel(statusTxt);
                })
                .subscribe();
        }
    </script>
</body>
</html>
